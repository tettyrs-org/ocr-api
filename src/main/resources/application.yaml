quarkus:
  application:
    name: ocr-api
    version: 1.0.0

  http:
    port: 8080
    host: 0.0.0.0
    limits:
      # Unggahan terbesar 25 MB (PDF), ditambah sedikit untuk bagian multipart (api-spec bagian 2)
      max-body-size: 30M
    cors:
      ~: true
      # Default placeholder agar tidak membuka semua origin bila env kosong
      origins: ${CORS_ALLOWED_ORIGINS:https://disabled.invalid}
      methods: GET,POST,PUT,OPTIONS
      headers: Authorization,Content-Type,Idempotency-Key,traceparent
      access-control-allow-credentials: false

  # Verifikasi ID token Firebase Authentication (lihat documents/tech/auth-firebase.md bagian 7)
  oidc:
    application-type: service
    auth-server-url: ${OIDC_AUTH_SERVER_URL:https://securetoken.google.com/ocr-wjv-b56b7}
    discovery-enabled: false
    jwks-path: ${OIDC_JWKS_PATH:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
    token:
      issuer: ${OIDC_ISSUER:https://securetoken.google.com/ocr-wjv-b56b7}
      audience: ${OIDC_AUDIENCE:ocr-wjv-b56b7}
    roles:
      role-claim-path: roles

  redis:
    hosts: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}
    timeout: 60000
    max-pool-size: 20

  log:
    level: INFO
    category:
      "org.tettyrs": DEBUG
      "io.quarkus": INFO
      "io.vertx": WARN
    console:
      format: "%d{HH:mm:ss.SSS} %-5p [%c{2.}] %s%e%n"
      json: false

  datasource:
    db-kind: postgresql
    jdbc:
      url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
      driver: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    min-size: 5
    max-size: 20

  hibernate-orm:
    database:
      generation: update
    log:
      sql: false

  flyway:
    migrate-at-start: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0.0.0
    baseline-description: "Initial baseline"

  cache:
    type: caffeine

  s3:
    endpoint-override: ${S3_ENDPOINT:http://minio:9000}
    path-style-access: true
    aws:
      region: ${AWS_REGION:us-east-1}
      credentials:
        type: static
        static-provider:
          access-key-id: ${AWS_ACCESS_KEY_ID:}
          secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

  smallrye-health:
    root-path: /q/health
    liveness-path: /live
    readiness-path: /ready

  micrometer:
    export:
      prometheus:
        enabled: true

tettyrs:
  s3:
    bucket: ${S3_BUCKET:ocr-documents}
    # Enkripsi sisi server (AES256 untuk SSE-S3). Kosong = tidak dikirim. MinIO lokal butuh KMS untuk SSE-S3.
    sse: ${S3_SSE:}
    file-expiry-days: 7
    max-file-size-mb: 25
    max-pdf-pages: 15

  api:
    rate-limit:
      upload-per-hour: 20
      reprocess-per-hour: 5
      telemetry-per-hour: 30
    poll-after-ms: 2000
    max-concurrent-uploads: 10

  async:
    ocr-timeout-seconds: 120
    llm-timeout-seconds: 60
    thread-pool-size: 20
