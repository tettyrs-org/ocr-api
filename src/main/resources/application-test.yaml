jwt:
  private-key-location: classpath:privateKey.pem
  public-key-location: classpath:publicKey.pem

mp:
  jwt:
    verify:
      issuer: http://localhost:8080
      publickey:
        location: classpath:publicKey.pem
      audiences: ocr-api

quarkus:
  # Test: Use H2 in-memory database
  datasource:
    db-kind: h2
    jdbc:
      url: "jdbc:h2:mem:test"
      driver: org.h2.Driver
    username: sa
    password: ""

  redis:
    hosts: redis://localhost:6379
    database: 0

  hibernate-orm:
    database:
      generation: create

  log:
    level: DEBUG
    category:
      "org.tettyrs": DEBUG
      "io.quarkus": DEBUG
      "io.vertx": WARN

  smallrye-jwt:
    sign:
      key-location: classpath:privateKey.pem
    verify:
      algorithm: RS256
