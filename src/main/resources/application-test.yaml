quarkus:
  # Job berkala (FilePurgeJob) tidak berjalan saat tes. Logikanya diuji langsung.
  scheduler:
    enabled: false
  oidc:
    tenant-enabled: false
  http:
    test-port: 0
    cors:
      origins: https://app.test.web.app
  # Test: PostgreSQL dan Redis sementara dari Dev Services (Docker lokal), terpisah dari stack dev
  datasource:
    db-kind: postgresql

  redis:
    hosts: redis://localhost:6379/15

  hibernate-orm:
    database:
      generation: none

  flyway:
    clean-at-start: true

  log:
    level: DEBUG
    category:
      "org.tettyrs": DEBUG
      "io.quarkus": DEBUG
      "io.vertx": WARN

